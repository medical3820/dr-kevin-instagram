name: Publish YouTube Short

# YouTube Shorts 전용 (초안).
# 예약: queue_shorts.txt 에서 publish_at 이 72시간 이내로 다가온 항목을 1편 업로드한다.
#       업로드는 privacyStatus=private + publishAt 이라 공개는 YouTube 가 그 시각에 정확히 한다
#       (GitHub 예약이 몇 시간 밀려도 공개 시각은 안 밀린다).
# 수동: Run workflow — folder 를 비우면 대기열 맨 위 미업로드 항목. dry_run=true 면 검사만(시크릿 불필요).
#
# ※ Google API 감사 통과 전에는 schedule 을 켜지 않는다.
#   감사 전 API 업로드는 '비공개(잠김)'으로 고정되고, Studio 수동 업로드와 겹치면 중복이 된다.

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "업로드할 폴더명 (비우면 queue_shorts.txt 맨 위 항목)"
        required: false
        default: ""
      dry_run:
        description: "true 면 short.json·영상 검사까지만 하고 올리지 않음"
        required: false
        default: "true"
  # 감사 통과 후 주석 해제:
  # schedule:
  #   - cron: "41 */3 * * *"

permissions:
  contents: write

# 인스타 워크플로(publish-log)와 그룹을 나눈다 — 같은 그룹이면 대기 중인 실행이 서로 취소될 수 있다
concurrency:
  group: publish-shorts
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 업로드
        timeout-minutes: 45
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          RESPECT_PUBLISH_AT: ${{ github.event_name == 'schedule' && '1' || '' }}
          EMPTY_OK: ${{ github.event_name == 'schedule' && '1' || '' }}
          FOLDER: ${{ github.event.inputs.folder }}
        run: python3 scripts/publish_youtube.py "$FOLDER"

      # 업로드 단계가 실패·시간 초과로 끝나도 기록은 커밋한다 — 자동 재업로드 방지의 핵심
      - name: 업로드 기록 커밋
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet published_shorts.txt; then
            echo "기록 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published_shorts.txt
          git commit -m "chore: 업로드 기록 업데이트 (short)"
          git pull --rebase
          git push
