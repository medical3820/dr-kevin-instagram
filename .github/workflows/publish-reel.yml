name: Publish reel

# 릴스 전용.
# 예약: 30분마다 queue_reels.txt 를 보고, post.json 의 publish_at 이 지난 항목을 1편 발행한다.
#       publish_at 이 없는 항목은 예약 실행으로는 절대 발행되지 않는다(버튼으로만).
# 수동: Run workflow — folder 를 비우면 publish_at 과 무관하게 대기열 맨 위 항목.
# 캐러셀(queue.txt)·한 장짜리(queue_single.txt)와 대기열이 분리돼 있다.

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "발행할 폴더명 (비우면 queue_reels.txt 맨 위 항목)"
        required: false
        default: ""
      dry_run:
        description: "true 면 영상·커버 URL 확인까지만 하고 발행하지 않음"
        required: false
        default: "false"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-log
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          QUEUE_FILE: queue_reels.txt
          RESPECT_PUBLISH_AT: ${{ github.event_name == 'schedule' && '1' || '' }}
          EMPTY_OK: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: python3 scripts/publish.py "${{ github.event.inputs.folder }}"

      - name: 발행 기록 커밋
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet published.txt; then
            echo "기록 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published.txt
          git commit -m "chore: 발행 기록 업데이트 (reel)"
          git pull --rebase
          git push
